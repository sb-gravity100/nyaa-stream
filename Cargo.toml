[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# enginefs is vendored (vendor/enginefs, MIT) to fix its libtorrent disk
# reader - see vendor/enginefs/VENDORED.md for what changed and why.
[patch."https://github.com/stremio-native/stream-server"]
enginefs = { path = "vendor/enginefs" }

# The player's close-time frame grab decodes and downscales a full-res mpv
# screenshot; unoptimized, that took long enough to be felt in dev builds.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
