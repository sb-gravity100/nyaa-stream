[package]
name = "enginefs"
version = "0.1.8"
edition = "2024"

[dependencies]
librqbit = { version = "8.1.1", optional = true }
# (nyaa-stream) sbtl, the streaming engine built for nyaa-stream - see backend/sbtl_backend.rs
sbtl = { git = "https://github.com/sb-gravity100/sbtl", tag = "v0.1.0", features = ["tokio"], optional = true }
# Same pinned git revision as the upstream workspace this crate was
# vendored from (see vendor/enginefs/VENDORED.md) - keeps the libtorrent
# C++ build identical and cached.
libtorrent-sys = { git = "https://github.com/stremio-native/stream-server", rev = "f585ab6eda9b1411034548c131bb0dc30c6f5f9e", optional = true }
tokio = { version = "1.42.0", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "sync",
    "process",
    "test-util",
] }
tokio-util = { version = "0.7.17", features = ["rt"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_bencode = "0.2"
serde_json = "1.0.133"
thiserror = "2.0"
tracing = "0.1"
async-trait = "0.1"
bytes = "1.9"
futures = "0.3"
url = "2.5"
hex = "0.4"
regex = "1.11"
anyhow = "1.0"
moka = { version = "0.12.11", features = ["future", "sync"] }
reqwest = { version = "0.13", features = ["json", "rustls"] }
urlencoding = "2.1"
bumpalo = { version = "3.19", features = ["collections"] }
memmap2 = "0.9.9"
parking_lot = "0.12.5"

[features]
default = ["libtorrent"]
librqbit = ["dep:librqbit"]
libtorrent = ["dep:libtorrent-sys"]
sbtl = ["dep:sbtl"]
