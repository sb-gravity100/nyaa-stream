[package]
name = "nyaa-client"
version = "0.1.0"
edition.workspace = true

[dependencies]
reqwest = { workspace = true }
urlencoding = "2"
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
scraper = "0.27.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Release title parsing for `EpisodeLabel` (MPL-2.0 anitopy port).
release-parse = { path = "../release-parse" }
# In-process streaming 7z reader (Apache-2.0, pure Rust); LZMA/LZMA2/BCJ/COPY only.
sevenz-rust2 = { version = "0.24", default-features = false }

[dev-dependencies]
tracing-subscriber.workspace = true
# Test-only: writes the tiny solid .7z fixture.
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
