[package]
name = "torrent-engine"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Pinned to the exact commit validated locally (built + `cargo check`ed
# against our own vcpkg.json/triplet at the project root) - see PLAN.md's
# streaming-server section for why this replaced our own librqbit session.
enginefs = { git = "https://github.com/stremio-native/stream-server", rev = "f585ab6eda9b1411034548c131bb0dc30c6f5f9e" }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
axum-extra = { version = "0.10", features = ["typed-header"] }
axum-range = "1.0.0"
tower-http = { version = "0.6", features = ["cors"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
