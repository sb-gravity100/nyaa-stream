[package]
name = "torrent-engine"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Pinned to the exact commit validated locally (built + `cargo check`ed
# against our own vcpkg.json/triplet at the project root) - see PLAN.md's
# streaming-server section for why this replaced our own librqbit session.
enginefs = { git = "https://github.com/stremio-native/stream-server", rev = "f585ab6eda9b1411034548c131bb0dc30c6f5f9e", default-features = false }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
axum-extra = { version = "0.10", features = ["typed-header"] }
axum-range = "1.0.0"
tower-http = { version = "0.6", features = ["cors"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# In-process FFmpeg (replaces spawning the ffmpeg/ffprobe CLI - see
# src/media.rs). Statically linked against the LGPL FFmpeg 7.1 built from
# the workspace vcpkg.json (found via VCPKGRS_TRIPLET/VCPKG_INSTALLED_DIR
# in .cargo/config.toml).
ez-ffmpeg = { version = "0.19", features = ["static"] }
ffmpeg-next = { version = "8.1", features = ["static"] }

[features]
# Torrent engine behind enginefs: libtorrent (default) or sb_torrent's tl
# (a sibling checkout at ../sb_torrent; see PLAN.md's streaming-server
# section). If both are enabled, libtorrent wins.
default = ["libtorrent"]
libtorrent = ["enginefs/libtorrent"]
tl = ["enginefs/tl"]
