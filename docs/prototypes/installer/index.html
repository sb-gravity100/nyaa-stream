<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nyaa-stream setup</title>
  <style>
    :root { color-scheme: dark; font: 14px "Segoe UI", sans-serif; background: #171a2b; color: #eceaf6; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 0, #2b3050, #171a2b 70%); }
    .window { width: min(540px, calc(100vw - 32px)); overflow: hidden; border: 1px solid rgba(236,234,246,.12); border-radius: 14px; background: #20243a; box-shadow: 0 24px 70px #08091399; }
    header { display: flex; align-items: center; gap: 11px; padding: 20px 24px; border-bottom: 1px solid rgba(236,234,246,.09); }
    header img { width: 38px; height: 38px; border-radius: 9px; }
    header strong { font-size: 15px; font-weight: 650; }
    header span { margin-left: auto; color: #9ea1c0; font-size: 11px; }
    main { min-height: 236px; padding: 30px 28px 25px; }
    .screen { display: none; }
    .screen.active { display: block; animation: arrive .16s ease-out; }
    @keyframes arrive { from { opacity: .5; transform: translateY(3px); } to { opacity: 1; transform: none; } }
    h1 { margin: 0 0 7px; font-size: 21px; font-weight: 620; letter-spacing: -.3px; }
    p { margin: 0 0 20px; color: #9ea1c0; line-height: 1.5; font-size: 12px; }
    label { display: block; margin-bottom: 6px; color: #c3c5da; font-size: 11px; }
    .path { display: flex; gap: 8px; }
    input[type=text] { flex: 1; min-width: 0; padding: 10px; border: 1px solid rgba(236,234,246,.13); border-radius: 6px; outline: none; background: #10121f; color: #eceaf6; font: inherit; font-size: 12px; }
    input[type=text]:focus { border-color: #f07aa6; }
    button { cursor: pointer; font: inherit; }
    .browse, .secondary { border: 1px solid rgba(236,234,246,.13); border-radius: 6px; background: #2b3050; color: #eceaf6; }
    .browse { padding: 0 12px; font-size: 11px; }
    .shortcut { display: flex; align-items: center; gap: 8px; margin-top: 15px; color: #c3c5da; font-size: 11px; }
    .shortcut input { accent-color: #f07aa6; }
    .shortcut + .shortcut { margin-top: 9px; }
    .progress { height: 6px; margin: 26px 0 9px; overflow: hidden; border-radius: 8px; background: #10121f; }
    .fill { width: 0; height: 100%; border-radius: inherit; background: #f07aa6; transition: width .2s ease; }
    .percent { color: #9ea1c0; font-size: 11px; text-align: right; }
    .error { color: #ff8a8a; }
    footer { display: flex; min-height: 60px; align-items: center; justify-content: space-between; padding: 0 24px; border-top: 1px solid rgba(236,234,246,.09); }
    .preview { color: #6c7092; font-size: 10px; }
    select { margin-left: 4px; border: 0; background: transparent; color: #9ea1c0; font: inherit; font-size: 10px; }
    .actions { display: flex; gap: 8px; }
    .secondary, .primary { padding: 10px 16px; font-size: 12px; }
    .primary { min-width: 112px; padding: 12px 22px; border: 0; border-radius: 7px; background: #f07aa6; color: #2a0f1c; font-size: 13px; font-weight: 650; }
    .primary:hover { background: #ff94bb; }
    .primary:disabled { cursor: default; opacity: .6; }
    .secondary { padding: 7px 12px; }
    @media (max-width: 460px) { main { padding: 24px 20px; } header, footer { padding-left: 18px; padding-right: 18px; } }
  </style>
</head>
<body>
  <section class="window" aria-label="Installer prototype">
    <header><img src="../../../src-tauri/icons/128x128.png" alt=""><strong>nyaa-stream</strong><span>Setup</span></header>
    <main>
      <section class="screen active" id="welcome">
        <h1>Install nyaa-stream</h1><p>Choose where to install the app.</p>
        <label for="path">Install location</label>
        <div class="path"><input id="path" type="text" value="%LOCALAPPDATA%\Programs\nyaa-stream"><button class="browse" onclick="browse()">Browse</button></div>
        <label class="shortcut"><input type="checkbox" checked> Start menu shortcut</label>
        <label class="shortcut"><input type="checkbox"> Desktop shortcut</label>
      </section>
      <section class="screen" id="installing">
        <h1>Installing…</h1><p id="progress-label">Copying app files</p>
        <div class="progress"><div class="fill" id="fill"></div></div><div class="percent" id="percent">0%</div>
      </section>
      <section class="screen" id="done">
        <h1>Installation complete</h1><p>Settings and watch progress are preserved.</p>
      </section>
      <section class="screen" id="error">
        <h1>Couldn't complete setup</h1><p class="error">The existing install and personal data are unchanged.</p>
      </section>
    </main>
    <footer><label class="preview">Preview<select aria-label="Preview state" onchange="show(this.value)"><option value="welcome">Welcome</option><option value="installing">Progress</option><option value="done">Complete</option><option value="error">Error</option></select></label><div class="actions"><button class="secondary" id="back" onclick="show('welcome')" hidden>Back</button><button class="primary" id="next" onclick="advance()">Install</button></div></footer>
  </section>
  <script>
    let timer;
    function browse() {
      const path = document.getElementById('path');
      const chosen = prompt('Install location', path.value);
      if (chosen?.trim()) path.value = chosen.trim();
    }
    function show(id) {
      clearInterval(timer);
      document.querySelectorAll('.screen').forEach(el => el.classList.toggle('active', el.id === id));
      document.querySelector('[aria-label="Preview state"]').value = id;
      document.getElementById('back').hidden = id !== 'error';
      const next = document.getElementById('next');
      next.textContent = id === 'welcome' || id === 'error' ? 'Install' : id === 'installing' ? 'Installing…' : 'Launch';
      next.disabled = id === 'installing';
      next.onclick = id === 'welcome' || id === 'error' ? advance : () => show('welcome');
      if (id === 'installing') runProgress();
    }
    function advance() { show('installing'); }
    function runProgress() {
      let value = 0;
      timer = setInterval(() => {
        value = Math.min(100, value + 5);
        document.getElementById('fill').style.width = value + '%';
        document.getElementById('percent').textContent = value + '%';
        if (value === 100) setTimeout(() => show('done'), 350);
      }, 100);
    }
  </script>
</body>
</html>
