[env]
# Keep vcpkg's static FFmpeg on the same x86-64-v3 and /MD ABI as the Rust binaries.
# Explicit CI environment values can still override these local defaults.
VCPKGRS_TRIPLET = "x64-windows-v3-static-md-release"
VCPKG_INSTALLED_DIR = { value = "vcpkg_installed", relative = true }
# In-process FFmpeg (crates/torrent-engine/src/media.rs): ffmpeg-sys-next
# reads the static FFmpeg that vcpkg.json builds straight from our manifest
# install tree (the `vcpkg` crate it would otherwise use only understands
# classic-mode installs); torrent-engine's build.rs links FFmpeg's own
# dependencies. bindgen needs libclang - a dev-machine default, overridden by
# a real LIBCLANG_PATH environment variable.
FFMPEG_DIR = { value = "vcpkg_installed/x64-windows-v3-static-md-release", relative = true }
LIBCLANG_PATH = "C:\\Program Files\\LLVM\\bin"

[target.'cfg(all(windows, target_env = "msvc"))']
# Keep Rust and C/C++ build-script output on the dynamic MSVC runtime. This
# permits the library to be embedded in /MD applications such as Slint/Skia.
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))']
rustflags = ["-C", "target-cpu=x86-64-v3"]

# Dev links with the toolchain's rust-lld instead of MSVC link.exe (much
# faster on this large binary - PLAN.md "Dev build speed"). Release builds
# (scripts/release.mjs) override this back to link.exe via
# CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
