[package]
name = "nyaa-stream"
version = "0.1.0"
description = "Anime-focused Stremio-like streaming client"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nyaa_stream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
base64 = { workspace = true }
# Classifying AniList failures (metadata_fallback.rs).
reqwest = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
torrent-engine = { path = "../crates/torrent-engine" }
nyaa-client = { path = "../crates/nyaa-client" }
anilist-client = { path = "../crates/anilist-client" }
kitsu-client = { path = "../crates/kitsu-client" }
mpv-player = { path = "../crates/mpv-player" }
# Native clipboard for the player's Ctrl+C frame copy: the WebView's async
# clipboard API pops a browser-style permission prompt in WebView2.
arboard = { version = "3", default-features = false, features = ["image-data"] }
# Decoding/downscaling mpv screenshots (player.rs: thumbnails, Ctrl+C copy).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
# Finding mpv's child window and pushing it below the webview (player.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
